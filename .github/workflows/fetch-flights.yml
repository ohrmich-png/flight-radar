name: fetch-flights
# Every 5 min: regional ADS-B feed (3 circles) + Israel-callsign watchlist
# + global tracking of watchlisted flights. Force-pushes a single commit
# (flights.json, global.json, watchlist.json) to the `data` branch.
# No API keys needed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch + build watchlist + track global
        id: fetch
        run: |
          set +e
          python3 scripts/fetch_all.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "Empty regional feed (source gap) - deliberate skip, not a failure"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"
      - name: Push to data branch (single commit)
        if: steps.fetch.outputs.skip != 'true'
        run: |
          rm -rf /tmp/data-push && mkdir -p /tmp/data-push && cd /tmp/data-push
          git init -q
          git config user.name "flight-radar-bot"
          git config user.email "flight-radar-bot@local"
          cp /tmp/flights.json /tmp/global.json /tmp/watchlist.json ./
          git add flights.json global.json watchlist.json
          git commit -qm "live flight data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מכ״ם טיסות · Flight Radar — Israel</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">✈</span>
      <div>
        <h1 data-i18n="title">מכ״ם טיסות</h1>
        <p class="tagline" data-i18n="subtitle">שמי ישראל · זמן אמת</p>
      </div>
    </div>
    <div class="live-stats">
      <div class="stat">
        <span class="stat-num" id="planeCount">—</span>
        <span class="stat-label" data-i18n="airborne">מטוסים באוויר</span>
      </div>
      <div class="stat">
        <span class="stat-num live-dot" id="clock">--:--:--</span>
        <span class="stat-label" data-i18n="localTime">שעה מקומית</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="countdown">—</span>
        <span class="stat-label" data-i18n="nextUpdate">עדכון הבא</span>
      </div>
    </div>
    <button id="langBtn" class="ghost-btn" title="English / עברית">EN</button>
  </header>

  <aside id="panel">
    <div class="seg" id="filterSeg">
      <button class="seg-btn active" data-filter="all" data-i18n="fAll">הכל</button>
      <button class="seg-btn" data-filter="to" data-i18n="fTo">לישראל</button>
      <button class="seg-btn" data-filter="from" data-i18n="fFrom">מישראל</button>
      <button class="seg-btn" data-filter="over" data-i18n="fOver">חולף</button>
    </div>
    <input id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="חיפוש לפי מספר טיסה…">
    <div id="quotaNote" class="quota" hidden></div>

    <section id="flightDetail" class="detail" hidden>
      <button id="detailClose" class="detail-close">✕</button>
      <div class="callsign" id="dCallsign">—</div>
      <div class="route-line"><span id="dOrigin">—</span><span class="route-arrow">→</span><span id="dDest">—</span></div>
      <div class="route-sub" id="dRouteSub">—</div>
      <div class="stat-grid">
        <div class="dstat"><span class="dval" id="dAlt">—</span><span class="dlab" data-i18n="alt">גובה (רגל)</span></div>
        <div class="dstat"><span class="dval" id="dSpeed">—</span><span class="dlab" data-i18n="speed">מהירות (קשר)</span></div>
        <div class="dstat"><span class="dval" id="dTrack">—</span><span class="dlab" data-i18n="heading">כיוון</span></div>
        <div class="dstat"><span class="dval" id="dVrate">—</span><span class="dlab" data-i18n="vrate">קצב אנכי</span></div>
      </div>
      <div class="meta-line"><span id="dIcao">—</span> · <span id="dCountry">—</span></div>
    </section>

    <section id="flightList" class="flight-list"></section>
  </aside>

  <div id="map"></div>

  <div id="legend" class="legend">
    <span class="leg-title" data-i18n="legend">גובה</span>
    <span class="leg-item"><i class="sw low"></i><span data-i18n="legLow">נמוך</span></span>
    <span class="leg-item"><i class="sw mid"></i><span data-i18n="legMid">בינוני</span></span>
    <span class="leg-item"><i class="sw high"></i><span data-i18n="legHigh">גבוה</span></span>
  </div>

  <div id="loader" class="loader">
    <div class="sweep"></div>
    <p data-i18n="loading">סורק את השמיים…</p>
  </div>

  <footer id="credit"><span data-i18n="credit">נתוני טיסות: OpenSky Network (ADS-B קהילתי) · מסלולים: adsbdb</span></footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
